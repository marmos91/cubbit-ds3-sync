[workspace]
resolver = "2"
members = [
    "ds3-models",
    "ds3-http",
    "ds3-auth",
    "ds3-s3",
    "ds3-sync",
    "ds3-ffi",
]

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["cookies", "json"] }
ring = "0.17"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
jsonwebtoken = "10"
urlencoding = "2"

