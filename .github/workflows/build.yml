name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --config apple/.swiftlint.yml --path apple/

  rust-check:
    name: Rust Core (fmt + clippy + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check formatting
        working-directory: core
        run: cargo fmt --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace -- -D warnings
      - name: Run tests
        working-directory: core
        run: cargo test --workspace --lib

  build:
    name: Build DS3Drive scheme
    runs-on: macos-26

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            apple/DS3Lib/.build
            ~/Library/Developer/Xcode/DerivedData/DS3Drive-*/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apple/DS3Lib/Package.resolved', 'apple/DS3Drive.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies -project apple/DS3Drive.xcodeproj -scheme DS3Drive
      - name: Build
        run: |
          xcodebuild clean build analyze \
            -project apple/DS3Drive.xcodeproj \
            -scheme DS3Drive \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  test-unit:
    name: Unit Tests (DS3Lib)
    runs-on: macos-26
    needs: lint

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: apple/DS3Lib/.build
          key: spm-ds3lib-${{ runner.os }}-${{ hashFiles('apple/DS3Lib/Package.resolved') }}
          restore-keys: spm-ds3lib-${{ runner.os }}-
      - name: Run unit tests
        run: swift test --package-path apple/DS3Lib

  test-integration:
    name: Integration Tests (DS3)
    runs-on: macos-26
    needs: test-unit
    # Only run on same-repo events (protects secrets from fork PRs)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      DS3_TEST_EMAIL: ${{ secrets.DS3_TEST_EMAIL }}
      DS3_TEST_PASSWORD: ${{ secrets.DS3_TEST_PASSWORD }}
      DS3_TEST_BUCKET: ${{ secrets.DS3_TEST_BUCKET }}

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: apple/DS3Lib/.build
          key: spm-ds3lib-${{ runner.os }}-${{ hashFiles('apple/DS3Lib/Package.resolved') }}
          restore-keys: spm-ds3lib-${{ runner.os }}-
      - name: Run integration tests
        run: swift test --package-path apple/DS3Lib --filter Integration

  build-ios:
    name: Build & Test iOS
    runs-on: macos-26
    needs: lint

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/DS3Drive-*/SourcePackages
          key: spm-ios-${{ runner.os }}-${{ hashFiles('apple/DS3Drive.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-ios-${{ runner.os }}-
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies -project apple/DS3Drive.xcodeproj -scheme DS3DriveApp
      - name: Build DS3DriveApp for iOS Simulator
        run: |
          xcodebuild build \
            -project apple/DS3Drive.xcodeproj \
            -scheme DS3DriveApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
      # DS3DriveAppTests requires App Group entitlements (the host app
      # crashes without them). Skipped in CI where CODE_SIGNING_ALLOWED=NO.
      # Run locally with: xcodebuild test -only-testing DS3DriveAppTests -scheme DS3DriveApp -destination 'platform=iOS Simulator,name=iPhone 17'
