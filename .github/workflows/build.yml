name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --config apple/.swiftlint.yml apple/

  rust-check:
    name: Rust Core (fmt + clippy + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check formatting
        working-directory: core
        run: cargo fmt --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace -- -D warnings
      - name: Schema parity fixture byte-equality (Rust vs Swift mirror)
        # Catches drift between core/ds3-models/tests/fixtures/ and the
        # apple/DS3Lib/Tests/DS3LibTests/Resources/fixtures/ mirror. If a
        # developer edits one side without running core/scripts/sync-fixtures.sh,
        # both Rust + Swift would still pass independently but exercise different
        # bytes — defeating the parity gate (Phase 16 Plan 06 / D-25 / T-16-06-03).
        run: |
          for f in core/ds3-models/tests/fixtures/*.json; do
            mirror="apple/DS3Lib/Tests/DS3LibTests/Resources/fixtures/$(basename "$f")"
            if ! diff -q "$f" "$mirror" >/dev/null 2>&1; then
              echo "::error::schema-parity fixture drift detected: $f vs $mirror"
              diff "$f" "$mirror" || true
              echo "::error::run core/scripts/sync-fixtures.sh and recommit"
              exit 1
            fi
          done
          echo "OK: schema-parity fixtures byte-identical across Rust and Swift"
      - name: Run tests (lib + tests incl. parity fixtures)
        working-directory: core
        run: cargo test --workspace --lib --tests
      - name: Schema parity gate (Rust serde fixtures)
        # Explicit step for visibility — failure here is the canonical D-25
        # signal that a Rust ds3-models field rename slipped through without
        # updating Swift Codable (or vice versa).
        working-directory: core
        run: cargo test --package ds3-models --tests _fixture_round_trip

  build:
    name: Build DS3Drive scheme
    runs-on: macos-15

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Cache Cargo (xcframework)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-xcframework-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-xcframework-${{ runner.os }}-
      - name: Build DS3CoreFFI XCFramework
        working-directory: core
        run: ./scripts/build-xcframework.sh --release
      - name: Verify XCFramework exists
        run: test -d core/out/DS3CoreFFI.xcframework && ls -la core/out/DS3CoreFFI.xcframework
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            apple/DS3Lib/.build
            ~/Library/Developer/Xcode/DerivedData/DS3Drive-*/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apple/DS3Lib/Package.resolved', 'apple/DS3Drive.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies -project apple/DS3Drive.xcodeproj -scheme DS3Drive
      - name: Build
        run: |
          xcodebuild clean build analyze \
            -project apple/DS3Drive.xcodeproj \
            -scheme DS3Drive \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  test-unit:
    name: Unit Tests (DS3Lib)
    runs-on: macos-15
    needs: lint

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Cache Cargo (xcframework)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-xcframework-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-xcframework-${{ runner.os }}-
      - name: Build DS3CoreFFI XCFramework
        working-directory: core
        run: ./scripts/build-xcframework.sh --release
      - name: Verify XCFramework exists
        run: test -d core/out/DS3CoreFFI.xcframework && ls -la core/out/DS3CoreFFI.xcframework
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: apple/DS3Lib/.build
          key: spm-ds3lib-${{ runner.os }}-${{ hashFiles('apple/DS3Lib/Package.resolved') }}
          restore-keys: spm-ds3lib-${{ runner.os }}-
      - name: Run unit tests
        run: swift test --package-path apple/DS3Lib

  test-integration:
    name: Integration Tests (DS3)
    runs-on: macos-15
    needs: test-unit
    # Only run on same-repo events (protects secrets from fork PRs)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      DS3_TEST_EMAIL: ${{ secrets.DS3_TEST_EMAIL }}
      DS3_TEST_PASSWORD: ${{ secrets.DS3_TEST_PASSWORD }}
      DS3_TEST_BUCKET: ${{ secrets.DS3_TEST_BUCKET }}

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Cache Cargo (xcframework)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-xcframework-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-xcframework-${{ runner.os }}-
      - name: Build DS3CoreFFI XCFramework
        working-directory: core
        run: ./scripts/build-xcframework.sh --release
      - name: Verify XCFramework exists
        run: test -d core/out/DS3CoreFFI.xcframework && ls -la core/out/DS3CoreFFI.xcframework
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: apple/DS3Lib/.build
          key: spm-ds3lib-${{ runner.os }}-${{ hashFiles('apple/DS3Lib/Package.resolved') }}
          restore-keys: spm-ds3lib-${{ runner.os }}-
      - name: Run integration tests
        run: swift test --package-path apple/DS3Lib --filter Integration

  build-ios:
    name: Build & Test iOS
    runs-on: macos-15
    needs: lint

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Cache Cargo (xcframework)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-xcframework-ios-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-xcframework-ios-${{ runner.os }}-
      - name: Build DS3CoreFFI XCFramework
        working-directory: core
        run: ./scripts/build-xcframework.sh --release
      - name: Verify XCFramework exists
        run: test -d core/out/DS3CoreFFI.xcframework && ls -la core/out/DS3CoreFFI.xcframework
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/DS3Drive-*/SourcePackages
          key: spm-ios-${{ runner.os }}-${{ hashFiles('apple/DS3Drive.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-ios-${{ runner.os }}-
      - name: Install iOS Simulator runtime
        run: xcodebuild -downloadPlatform iOS
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies -project apple/DS3Drive.xcodeproj -scheme DS3DriveApp
      - name: Build DS3DriveApp for iOS Simulator
        run: |
          xcodebuild build \
            -project apple/DS3Drive.xcodeproj \
            -scheme DS3DriveApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      # DS3DriveAppTests requires App Group entitlements (the host app
      # crashes without them). Skipped in CI where CODE_SIGNING_ALLOWED=NO.
      # Run locally with: xcodebuild test -only-testing DS3DriveAppTests -scheme DS3DriveApp -destination 'generic/platform=iOS Simulator'

  rust-test-integration:
    name: Rust Integration Tests (Cubbit S3)
    runs-on: ubuntu-latest
    needs: rust-check
    # Only run on same-repo events (protects secrets from fork PRs)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      DS3_TEST_EMAIL: ${{ secrets.DS3_TEST_EMAIL }}
      DS3_TEST_PASSWORD: ${{ secrets.DS3_TEST_PASSWORD }}
      DS3_TEST_BUCKET: ${{ secrets.DS3_TEST_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-integration-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-integration-${{ runner.os }}-
      - name: Run panic safety tests
        working-directory: core
        run: cargo test -p ds3-ffi --test panic_tests
      - name: Run integration tests
        working-directory: core
        # --test-threads=1: integration tests share a single Cubbit account
        # and the challenge endpoint is one-time-use. Parallel auths race and
        # the second hit returns "opaque challenge verification failed".
        run: cargo test --workspace --features integration --test integration -- --test-threads=1
        if: env.DS3_TEST_EMAIL != ''

  csharp-test:
    name: C# P/Invoke Tests (Windows)
    runs-on: windows-latest
    needs: rust-check
    # Only run on same-repo events (protects secrets from fork PRs)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      DS3_TEST_EMAIL: ${{ secrets.DS3_TEST_EMAIL }}
      DS3_TEST_PASSWORD: ${{ secrets.DS3_TEST_PASSWORD }}
      DS3_TEST_BUCKET: ${{ secrets.DS3_TEST_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-windows-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-windows-${{ runner.os }}-
      - name: Build Rust core (cdylib)
        working-directory: core
        run: cargo build -p ds3-ffi --release
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Copy native library to harness output
        shell: pwsh
        run: |
          $outDir = "core/tests/csharp_harness/bin/Release/net8.0"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item "core/target/release/ds3_ffi.dll" -Destination $outDir -ErrorAction SilentlyContinue
          # Also copy to working directory for local runs
          Copy-Item "core/target/release/ds3_ffi.dll" -Destination "core/tests/csharp_harness/" -ErrorAction SilentlyContinue
      - name: Run C# integration tests
        working-directory: core/tests/csharp_harness
        run: dotnet run --configuration Release
        if: env.DS3_TEST_EMAIL != ''
